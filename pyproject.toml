[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sloptools"
dynamic = ["version"]
description = "Deterministic code-quality tools for Python codebases: sloptrace (complexity erosion over git history)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["complexity", "code-quality", "static-analysis", "technical-debt", "ai-generated-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "sjtechdev" }]
requires-python = ">=3.9"
dependencies = [
    "radon>=6.0",
    "complexipy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sloptrace = "sloptools.trace.cli:main"

[project.urls]
Homepage = "https://github.com/sjtechdev/sloptools"
Repository = "https://github.com/sjtechdev/sloptools"
Issues = "https://github.com/sjtechdev/sloptools/issues"

[tool.setuptools.dynamic]
version = { attr = "sloptools.__version__" }

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["python/sloptools"]
